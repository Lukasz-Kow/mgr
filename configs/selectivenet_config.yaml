# SelectiveNet Configuration (Phase 2: MONAI ResNet3D-10 + MedicalNet)

model:
  backbone:
    type: monai
    use_3d: true
    arch_3d: 'resnet10'
    pretrained: medicalnet
    in_channels: 1
    shortcut_type: B
    bias_downsample: false

  classifier:
    dropout: 0.6
    selection_dropout: 0.3
    num_classes: 2

  fine_tune:
    freeze_encoder_epochs: 3
    encoder_lr: 0.00001
    head_lr: 0.0001

selective_net:
  target_coverage: 0.65
  selection_threshold: 0.35
  alpha: 0.7
  aux_weight: 0.3
  coverage_penalty: 5.0

training:
  epochs: 120
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.001
  warmup_epochs: 8

  optimizer: 'adam'

  scheduler:
    type: 'reduce_on_plateau'
    patience: 5
    factor: 0.5
    min_lr: 0.000001

  early_stopping:
    enabled: true
    patience: 30
    metric: 'val_sensitivity_at_target_spec'
    mode: 'max'

data:
  metadata_csv: 'data_metadata_adni.csv'

checkpoint:
  dir: 'checkpoints/selective_net_monai'
  save_best_only: true
  monitor: 'val_sensitivity_at_target_spec'
  mode: 'max'

logging:
  tensorboard_dir: 'runs/selective_net_monai'
  log_interval: 10
  save_predictions: true

device: 'cuda'
seed: 42
