# Baseline Model Configuration (Phase 2: MONAI ResNet3D-10 + MedicalNet)

model:
  backbone:
    type: monai
    use_3d: true
    arch_3d: 'resnet10'
    pretrained: medicalnet
    in_channels: 1
    shortcut_type: B
    bias_downsample: false

  classifier:
    dropout: 0.6
    num_classes: 2

  fine_tune:
    freeze_encoder_epochs: 3
    encoder_lr: 0.00001
    head_lr: 0.0001

training:
  epochs: 100
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.001
  warmup_epochs: 8

  optimizer: 'adam'

  scheduler:
    type: 'reduce_on_plateau'
    patience: 5
    factor: 0.5
    min_lr: 0.000001

  early_stopping:
    enabled: true
    patience: 30
    metric: 'val_sensitivity_at_target_spec'
    mode: 'max'

  use_class_weights: false

rejection:
  enabled: true
  thresholds: [0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

data:
  metadata_csv: 'data_metadata_adni.csv'

checkpoint:
  dir: 'checkpoints/baseline_monai'
  save_best_only: true
  monitor: 'val_sensitivity_at_target_spec'
  mode: 'max'

logging:
  tensorboard_dir: 'runs/baseline_monai'
  log_interval: 10
  save_predictions: true

device: 'cuda'
seed: 42
