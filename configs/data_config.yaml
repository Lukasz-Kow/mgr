# Data configuration for MCI classification

# Preprocessing settings
preprocessing:
  target_size: [128, 128, 128]  # (D, H, W) for 3D
  normalize_method: 'zscore'  # 'zscore', 'minmax', or 'none'

# Augmentation settings (applied only to training set)
augmentation:
  enabled: true
  horizontal_flip: true
  rotation_range: 5.0   # degrees (reduced for small ADNI subset)
  random_brightness: 0.05  # +/- 5%
  random_contrast: 0.05    # +/- 5%
  elastic_deformation: false   # TorchIO elastic deformation (disabled for speed)
  bias_field: false             # TorchIO bias field (disabled for speed)

# Dataset splits
splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratify: true
  random_seed: 42

# DataLoader settings
dataloader:
  batch_size: 1  # GTX 1050 / 3D volumes
  num_workers: -1  # Automatic detection
  pin_memory: true
  balance_classes: true

# Paths
paths:
  dataset_root: 'Data baseline'
  metadata_csv: 'data_metadata_adni.csv'
