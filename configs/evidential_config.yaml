# Evidential Deep Learning (EDL) Configuration (MONAI + MedicalNet)

model:
  backbone:
    type: monai
    use_3d: true
    arch_3d: 'resnet10'
    pretrained: medicalnet
    in_channels: 1
    shortcut_type: B
    bias_downsample: false

  classifier:
    dropout: 0.6
    num_classes: 2

  fine_tune:
    freeze_encoder_epochs: 3
    encoder_lr: 0.00001
    head_lr: 0.0001

evidential:
  kl_weight: 1.0
  kl_anneal_start: 0
  kl_anneal_end: 40
  uncertainty_type: 'epistemic'

training:
  epochs: 150
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.001
  warmup_epochs: 8
  validate_every_n: 2

  optimizer: 'adam'

  scheduler:
    type: 'reduce_on_plateau'
    patience: 5
    factor: 0.5
    min_lr: 0.000001

  early_stopping:
    enabled: true
    patience: 15
    metric: 'val_sensitivity_at_target_spec'
    mode: 'max'

data:
  metadata_csv: 'data_metadata_adni.csv'

checkpoint:
  dir: 'checkpoints/evidential'
  save_best_only: true
  monitor: 'val_sensitivity_at_target_spec'
  mode: 'max'

logging:
  tensorboard_dir: 'runs/evidential'
  log_interval: 10
  save_predictions: true

device: 'cuda'
seed: 42
