# Baseline Phase 1 (simple 3D CNN) — for evaluation comparison only

model:
  backbone:
    type: simple
    use_3d: true
    arch_3d: 'resnet3d_18'
    pretrained: false
    in_channels: 1
  classifier:
    dropout: 0.6
    num_classes: 2

training:
  epochs: 80
  batch_size: 1
  learning_rate: 0.00005
  weight_decay: 0.001
  optimizer: 'adam'
  scheduler:
    type: 'reduce_on_plateau'
    patience: 5
    factor: 0.5
    min_lr: 0.000001
  early_stopping:
    enabled: true
    patience: 10
    metric: 'val_sensitivity_at_target_spec'
    mode: 'max'
  use_class_weights: false

rejection:
  enabled: true
  thresholds: [0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

data:
  metadata_csv: 'data_metadata_adni.csv'

checkpoint:
  dir: 'checkpoints/baseline'
  save_best_only: true
  monitor: 'val_sensitivity_at_target_spec'
  mode: 'max'

logging:
  tensorboard_dir: 'runs/baseline'
  log_interval: 10
  save_predictions: true

device: 'cuda'
seed: 42
